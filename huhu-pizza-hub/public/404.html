<!doctype html>
<html lang="en-KE">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#F7F3EB" />
    <meta name="description" content="We could not find that page. Return to Huhus Pizza & Grill or browse our menu in Kitisuru, Nairobi." />
    <title>Page not found | Huhus Pizza &amp; Grill</title>
    <style>
      :root { color-scheme: light; font-family: Arial, sans-serif; color: #121212; background: #f7f3eb; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
      main { width: min(100%, 680px); padding: clamp(28px, 6vw, 64px); border: 1px solid #dfd7c7; border-radius: 24px; background: #fffdf9; box-shadow: 0 16px 40px rgba(18, 18, 18, .09); text-align: center; }
      img { width: min(180px, 48vw); height: auto; margin: 0 auto 24px; }
      .code { color: #c8521a; font-size: clamp(4.5rem, 18vw, 8rem); font-weight: 900; letter-spacing: -.09em; line-height: .9; }
      h1 { margin: 20px 0 10px; font-size: clamp(1.9rem, 6vw, 3.2rem); letter-spacing: -.045em; }
      p { max-width: 480px; margin: 0 auto 28px; color: #5a544a; line-height: 1.6; }
      nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
      a { display: inline-flex; min-height: 48px; align-items: center; justify-content: center; padding: 0 24px; border: 1px solid #c8521a; border-radius: 999px; background: #c8521a; color: #fff; font-weight: 700; text-decoration: none; }
      a.secondary { background: transparent; color: #121212; }
      a:focus-visible { outline: 3px solid #c8521a; outline-offset: 3px; }
      @media (max-width: 480px) { nav, nav a { width: 100%; } }
    </style>
  </head>
  <body>
    <main>
      <img src="/Huhus_logo.png" alt="Huhus Pizza &amp; Grill" />
      <div class="code" aria-hidden="true">404</div>
      <h1>This page isn’t on the menu.</h1>
      <p>The address may be outdated or mistyped. Head home or browse the menu to find your next favorite.</p>
      <nav aria-label="404 page actions">
        <a href="/">Back to Home</a>
        <a class="secondary" href="/menu">Browse the Menu</a>
      </nav>
    </main>
  </body>
</html>
